name: Build GKI Kernel

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      kernel_branch:
        description: 'Kernel branch to build'
        required: false
        default: 'android12-5.10'
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build vanilla GKI (android12-5.10)
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout builder
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            aria2 git make python3 python3-pip zip curl bc \
            bison flex libssl-dev libelf-dev lld llvm

      - name: Install Python deps
        run: pip3 install lxml

      - name: Show toolchain info
        run: |
          echo "CPUs: $(nproc --all)"
          echo "Disk: $(df -h / | tail -1)"
          python3 --version

      - name: Make scripts executable
        run: |
          chmod +x *.sh
          chmod +x scripts/*.py || true

      - name: Run build
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: ./build.sh

      - name: Upload flashable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: gki-kernel-zip
          path: |
            *.zip
            build.log
          if-no-files-found: error
          retention-days: 30

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: warn

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-22.04
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: gki-kernel-zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: GKI Build ${{ github.run_number }}
          files: '*.zip'
          generate_release_notes: true
