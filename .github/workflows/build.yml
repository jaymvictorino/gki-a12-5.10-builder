name: Build Kernel (android12-5.10)

# Manual trigger only.
on:
  workflow_dispatch:
    inputs:
      variant:
        description: 'Kernel variant (ignored when output=release)'
        required: true
        default: 'VNL'
        type: choice
        options:
          - VNL
          - KSU

      build_type:
        description: 'Build type'
        required: true
        default: 'normal'
        type: choice
        options:
          - normal
          - staging

      output:
        description: 'Output (release builds both VNL and KSU)'
        required: true
        default: 'actions'
        type: choice
        options: 
          - actions
          - release

permissions:
  contents: write

env:
  BUILD_TYPE: ${{ inputs.build_type }}
  STAGE_SUFFIX: ${{ inputs.build_type == 'staging' && '-staging' || '' }}
  OUTPUT: ${{ inputs.output }}

jobs:
  # Decides which variants to build.
  # - output=release:  both VNL and KSU, in parallel
  # - output=actions:  only the variant the user picked
  prepare:
    name: Prepare build matrix
    runs-on: ubuntu-latest
    outputs:
      variants: ${{ steps.set.outputs.variants }}
    steps:
      - name: Determine variants
        id: set
        run: |
          if [[ "${{ inputs.output }}" == "release" ]]; then
            variants='["VNL","KSU"]'
          else
            variants='["${{ inputs.variant }}"]'
          fi
          echo "variants=$variants" >> "$GITHUB_OUTPUT"
          echo "Will build: $variants"

  build:
    name: Build android12-5.10 GKI (${{ matrix.variant }})
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(needs.prepare.outputs.variants) }}
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    env:
      VARIANT: ${{ matrix.variant }}

    steps:
      # 1. Check out THIS repo (workflow + build script).
      - name: Checkout build scripts
        uses: actions/checkout@v7

      # 2. Check out the kernel source into ./kernel.
      - name: Checkout kernel source
        uses: actions/checkout@v7
        with:
          repository: ramabondanp/android_kernel_common-5.10
          ref: ${{ inputs.build_type == 'staging' && 'android12-5.10-staging' || 'android12-5.10' }}
          path: kernel

      # 3. Free disk space — a full LTO kernel build needs ~25+ GB.
      - name: Free up disk space
        uses: jlumbroso/free-disk-space@main
        with:
          preinstalled-runtimes: true
          android: false
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      # 4. Install host dependencies + Python packages for KMI verification.
      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache cpio curl device-tree-compiler \
            flex git libelf-dev libssl-dev lz4 make python3 python3-pip \
            rsync unzip zip zstd libncurses-dev
          pip3 install --no-cache-dir lxml rich

      # 5a. BakaSU integration – only for the KSU matrix entry.
      - name: Integrate BakaSU
        if: ${{ matrix.variant == 'KSU' }}
        working-directory: kernel
        run: |
          curl -LSs "https://raw.githubusercontent.com/Baka-SU/BakaSU/main/kernel/setup.sh" | bash

      # 5b. Copy the user's build script into the kernel tree and run it.
      - name: Build kernel
        working-directory: kernel
        run: |
          cp ../scripts/build.sh build.sh
          chmod +x build.sh
          ./build.sh

      # 6a. Sanity-check the produced Image before packaging.
      - name: Verify kernel image
        run: |
          ls -lh kernel/out/arch/arm64/boot/Image
          file kernel/out/arch/arm64/boot/Image

      # 6b. Gather metadata for the release body.
      - name: Collect build info
        id: buildinfo
        run: |
          KSRC="$GITHUB_WORKSPACE/kernel"
          OUT="$KSRC/out"

          # Format: "vX.Y.Z (short_hash)" when a tag exists, "(short_hash)" otherwise.
          format_version() {
            local dir="$1"
            local tag hash
            tag=$(git -C "$dir" describe --tags --abbrev=0 2>/dev/null || true)
            hash=$(git -C "$dir" rev-parse --short HEAD 2>/dev/null || echo "unknown")
            if [[ -n "$tag" ]]; then
              printf '%s (%s)' "$tag" "$hash"
            else
              printf '(%s)' "$hash"
            fi
          }

          KVER=$(awk -F'"' '/^#define[[:space:]]+UTS_RELEASE/{print $2; exit}' \
                    "$OUT/include/generated/utsrelease.h")

          KCOMMIT_SHORT=$(git -C "$KSRC" rev-parse --short HEAD)
          KCOMMIT_LONG=$(git -C "$KSRC" rev-parse HEAD)

          LLVM_VER=$(grep -oP 'readonly LLVM_VERSION="\K[^"]+' \
                        "$GITHUB_WORKSPACE/scripts/build.sh")

          BAKASU_VER="n/a"
          if [[ -d "$KSRC/KernelSU/.git" ]]; then
            BAKASU_VER=$(format_version "$KSRC/KernelSU")
          fi

          NOMOUNT_VER="n/a"
          if [[ -d "$KSRC/NoMount/.git" ]]; then
            NOMOUNT_VER=$(format_version "$KSRC/NoMount")
          fi

          BUILD_TS=$(date -u +"%Y-%m-%d %H:%M:%S UTC")

          {
            echo "kver=$KVER"
            echo "kcommit_short=$KCOMMIT_SHORT"
            echo "kcommit_long=$KCOMMIT_LONG"
            echo "llvm_ver=$LLVM_VER"
            echo "bakasu_ver=$BAKASU_VER"
            echo "nomount_ver=$NOMOUNT_VER"
            echo "build_ts=$BUILD_TS"
          } >> "$GITHUB_OUTPUT"

      # 7. Package into an AnyKernel3 flashable zip.
      - name: Package AnyKernel3
        env:
          KVER: ${{ steps.buildinfo.outputs.kver }}
        run: |
          git clone --depth=1 https://github.com/jaymvictorino/AnyKernel3.git /tmp/AnyKernel3
          cp kernel/out/arch/arm64/boot/Image /tmp/AnyKernel3/Image
          cd /tmp/AnyKernel3
          zip -r9 "$GITHUB_WORKSPACE/AK3-${KVER}-${VARIANT}${STAGE_SUFFIX}.zip" . \
            -x ".git/*" "README.md" "LICENSE"

      # 8. Upload the AnyKernel3 zip.
      - name: Upload AnyKernel3 artifact
        uses: actions/upload-artifact@v7
        with:
          name: AK3-${{ steps.buildinfo.outputs.kver }}-${{ env.VARIANT }}${{ env.STAGE_SUFFIX }}
          path: AK3-${{ steps.buildinfo.outputs.kver }}-${{ env.VARIANT }}${{ env.STAGE_SUFFIX }}.zip
          if-no-files-found: error

      # 9. Save build metadata.
      # Only when a release is going to be created: persist per-variant metadata
      # as an artifact so the release job can read it without re-checking out.
      - name: Save build metadata
        if: inputs.output == 'release'
        run: |
          jq -n \
            --arg kver         '${{ steps.buildinfo.outputs.kver }}' \
            --arg kcommit      '${{ steps.buildinfo.outputs.kcommit_short }}' \
            --arg kcommit_long '${{ steps.buildinfo.outputs.kcommit_long }}' \
            --arg llvm         '${{ steps.buildinfo.outputs.llvm_ver }}' \
            --arg bakasu       '${{ steps.buildinfo.outputs.bakasu_ver }}' \
            --arg nomount      '${{ steps.buildinfo.outputs.nomount_ver }}' \
            --arg ts           '${{ steps.buildinfo.outputs.build_ts }}' \
            '{kver:$kver, kcommit_short:$kcommit, kcommit_long:$kcommit_long, llvm_ver:$llvm, bakasu_ver:$bakasu, nomount_ver:$nomount, build_ts:$ts}' \
            > "metadata-${{ matrix.variant }}.json"

      # 10. Upload build metadata.
      - name: Upload build metadata
        if: inputs.output == 'release'
        uses: actions/upload-artifact@v7
        with:
          name: meta-${{ matrix.variant }}
          path: metadata-${{ matrix.variant }}.json

  # Consolidated release: waits for every matrix build, downloads all zips,
  # publishes a single release tagged with the shared kernel version.
  release:
    name: Create consolidated release
    needs: [prepare, build]
    if: inputs.output == 'release'
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: Inspect downloaded artifacts
        run: find artifacts -maxdepth 2 -type f | sort

      - name: Prepare assets and metadata
        id: prep
        run: |
          set -euo pipefail

          mkdir -p release-assets
          find artifacts -name 'AK3-*.zip' -exec mv {} release-assets/ \;

          ZIP_COUNT=$(find release-assets -name 'AK3-*.zip' | wc -l)
          echo "Found $ZIP_COUNT zip(s) for the release"
          if [[ "$ZIP_COUNT" -lt 1 ]]; then
            echo "No zip artifacts found — aborting" >&2
            exit 1
          fi

          # Shared metadata: kver, kcommit, llvm, nomount, build_ts are identical
          # across variants; prefer KSU's file because it also carries bakasu_ver.
          META=""
          for v in KSU VNL; do
            f=$(find artifacts -name "metadata-${v}.json" | head -n1)
            if [[ -n "$f" ]]; then META="$f"; break; fi
          done
          if [[ -z "$META" ]]; then
            echo "No metadata file found — aborting" >&2
            exit 1
          fi
          echo "Using metadata: $META"

          KVER=$(jq -r '.kver' "$META")
          KCOMMIT=$(jq -r '.kcommit_short' "$META")
          KCOMMIT_LONG=$(jq -r '.kcommit_long' "$META")
          LLVM=$(jq -r '.llvm_ver' "$META")
          NOMOUNT=$(jq -r '.nomount_ver' "$META")
          BUILT_AT=$(jq -r '.build_ts' "$META")

          KSU_META=$(find artifacts -name 'metadata-KSU.json' | head -n1)
          if [[ -n "$KSU_META" ]]; then
            BAKASU=$(jq -r '.bakasu_ver' "$KSU_META")
          else
            BAKASU="n/a"
          fi

          {
            echo "kver=$KVER"
            echo "kcommit=$KCOMMIT"
            echo "kcommit_long=$KCOMMIT_LONG"
            echo "llvm=$LLVM"
            echo "bakasu=$BAKASU"
            echo "nomount=$NOMOUNT"
            echo "built_at=$BUILT_AT"
          } >> "$GITHUB_OUTPUT"

          ls -lh release-assets/

      - name: Create consolidated GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.prep.outputs.kver }}
          name: ${{ steps.prep.outputs.kver }}
          body: |
            ## GKI build — android12-5.10

            **Kernel version:** `${{ steps.prep.outputs.kver }}`
            **Build type:** `${{ env.BUILD_TYPE }}`

            ### Build info

            | Item | Value |
            |------|-------|
            | Kernel commit | [`${{ steps.prep.outputs.kcommit }}`](https://github.com/ramabondanp/android_kernel_common-5.10/commit/${{ steps.prep.outputs.kcommit_long }}) |
            | Source branch | `${{ inputs.build_type == 'staging' && 'android12-5.10-staging' || 'android12-5.10' }}` |
            | LLVM version | `${{ steps.prep.outputs.llvm }}` |
            | BakaSU | `${{ steps.prep.outputs.bakasu }}` |
            | NoMount | `${{ steps.prep.outputs.nomount }}` |
            | Built at | `${{ steps.prep.outputs.built_at }}` |
            | Workflow run | [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) |

            ### Downloads

            Both variants were built from the same kernel source and toolchain:

            - **Vanilla** — `AK3-…-VNL.zip` — pure GKI, no root integration
            - **KernelSU** — `AK3-…-KSU.zip` — BakaSU integrated

            ### Installation

            Flash the desired AnyKernel3 zip via a custom recovery (TWRP, etc.) or a kernel manager app.

            ---
            *Built automatically by [GitHub Actions](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}).*
          files: release-assets/*.zip
          fail_on_unmatched_files: true
          generate_release_notes: false
          draft: false
          prerelease: ${{ inputs.build_type == 'staging' }}
          make_latest: ${{ inputs.build_type == 'normal' && 'true' || 'false' }}