name: Build Vanilla Kernel (test)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-kernel:
    name: Build Kernel
    runs-on: ubuntu-22.04
    steps:
      - name: Pre-fetch Clang and stub binutils to skip AOSP GCC download
        run: |
          set -euo pipefail
          mkdir -p /home/runner/clang
          curl -L -o /tmp/clang.tar.gz \
            "https://github.com/jaymvictorino/clang-r596125-mirror/releases/download/v0.0.1/linux-x86-refs-heads-mirror-goog-main-llvm-toolchain-source-clang-r596125.tar.gz"
          tar xzf /tmp/clang.tar.gz -C /home/runner/clang --strip-components=1

          # Create stub binutils directories so the action's existence check passes.
          # The actual build uses LLVM=1 and never executes these symlinks.
          for pair in "gcc-64:aarch64-linux-android" "gcc-32:arm-linux-androideabi"; do
            dir="${pair%%:*}"
            prefix="${pair##*:}"
            mkdir -p "/home/runner/${dir}/bin"
            for tool in gcc g++ cc c++ ar nm objcopy objdump strip ld as ranlib readelf; do
              if [ -x "/home/runner/clang/bin/llvm-${tool}" ]; then
                ln -sf "/home/runner/clang/bin/llvm-${tool}" \
                       "/home/runner/${dir}/bin/${prefix}-${tool}"
              fi
            done
          done

      - name: Build
        uses: dabao1955/kernel_build_action@main
        with:
          kernel-url: https://github.com/ramabondanp/android_kernel_common-5.10
          kernel-branch: android12-5.10
          config: gki_defconfig
          arch: arm64
          other-clang-url: https://github.com/jaymvictorino/clang-r596125-mirror/releases/download/v0.0.1/linux-x86-refs-heads-mirror-goog-main-llvm-toolchain-source-clang-r596125.tar.gz
          anykernel3: true
          anykernel3-url: https://github.com/osm0sis/AnyKernel3
          release: true
          access-token: ${{ secrets.GITHUB_TOKEN }}
          extra-make-args: LLVM=1
